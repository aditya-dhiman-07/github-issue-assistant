version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: issue-assistant-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: issue-assistant-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: issue-assistant-backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
      - ollama

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: issue-assistant-frontend
    env_file:
      - .env
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  qdrant_data:
  ollama_data:
